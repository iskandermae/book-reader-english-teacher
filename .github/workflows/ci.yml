name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      # Includes the contract staleness test. UPDATE_OPENAPI must NOT be set here,
      # otherwise that test regenerates the file instead of checking it.
      - run: dotnet test --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # build and test run the API client generation first (npm pre* scripts).
      - run: npm run build
      - run: npm test -- --watch=false
